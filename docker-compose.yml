# LOCAL development only: single-node replica set, no authentication or HA.
# Runtime has no backup/import tools, root-switch helper or automatic initdb support.
# Never point this stack at an existing database or expose it to a network.
name: animal-feed-local
services:
  mongo-db:
    image: afw-mongo-local:8.0.34
    build:
      context: .
      dockerfile: docker/mongodb.Dockerfile
    command: ["mongod", "--replSet", "afwlocal", "--bind_ip_all"]
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - mongo-local-rs-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "const h=db.hello(); quit(h.setName === 'afwlocal' && h.isWritablePrimary ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  # Explicit opt-in for a NEW LOCAL replica set; never part of normal app startup.
  # Run: docker compose --profile setup run --rm mongo-rs-init
  mongo-rs-init:
    image: afw-mongo-local:8.0.34
    profiles: [setup]
    depends_on:
      mongo-db:
        condition: service_started
    entrypoint: ["mongosh", "--host", "mongo-db:27017", "--quiet", "--eval"]
    command:
      - >-
        let ready=false;
        for(let i=0;i<60;i++){try{db.adminCommand({ping:1});ready=true;break;}catch(e){sleep(1000);}}
        if(!ready)quit(1);
        try{const s=rs.status();if(s.set!=='afwlocal')throw Error('Unexpected replica set');}
        catch(e){if(e.code!==94)throw e;const r=rs.initiate({_id:'afwlocal',members:[{_id:0,host:'mongo-db:27017'}]});if(!r.ok)quit(1);}
        for(let i=0;i<60;i++){if(db.hello().isWritablePrimary)quit(0);sleep(1000);}quit(1);

  nest-app:
    build:
      context: .
      target: development
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      mongo-db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3000
      MONGO_URL: mongodb://mongo-db:27017/animal_feed_local?replicaSet=afwlocal
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000,http://localhost:5173}
      CORS_CREDENTIALS: ${CORS_CREDENTIALS:-true}
    # No seed, bootstrap, audit initialization or coordinator initialization here.
    command: ["npm", "run", "start:dev"]

volumes:
  # New name deliberately avoids reusing the historical school-data volume.
  mongo-local-rs-data:
